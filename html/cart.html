<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteHub - Your Cart</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0d;
            color: white;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #111;
            border-bottom: 1px solid #292929;
            padding: 18px 7%;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            text-decoration: none;
            color: white;
            font-size: 30px;
            font-weight: 800;
        }

        .logo span {
            color: #ff4b23;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #ff4b23;
        }

        .cart-link {
            position: relative;
        }

        #cart-count {
            position: absolute;
            top: -13px;
            right: -16px;

            min-width: 20px;
            height: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff4b23;
            color: white;

            border-radius: 50%;

            font-size: 11px;
            font-weight: bold;
        }

        .login-btn {
            border: 1px solid #ff4b23;
            padding: 10px 20px;
            border-radius: 25px;
        }


        /* =========================
           MAIN
        ========================= */

        .cart-page {
            width: 90%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            color: white;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #aaa;
        }


        /* =========================
           LAYOUT
        ========================= */

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }


        /* =========================
           CART BOX
        ========================= */

        .cart-box {
            background: #171717;
            border: 1px solid #2b2b2b;
            border-radius: 18px;
            padding: 25px;
        }

        .cart-box h2 {
            margin-top: 0;
            color: white;
        }


        /* =========================
           CART ITEM
        ========================= */

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #303030;
        }

        .cart-item:last-child {
            border-bottom: none;
        }


        .cart-item-image {
            width: 105px;
            height: 105px;
            flex-shrink: 0;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }


        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            color: white;
            font-size: 18px;
            margin: 0 0 8px;
        }

        .cart-item-info p {
            color: #aaa;
            margin: 0 0 14px;
        }


        /* =========================
           QUANTITY
        ========================= */

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-control button {
            width: 32px;
            height: 32px;

            border: 1px solid #444;
            background: #222;
            color: white;

            border-radius: 6px;

            cursor: pointer;
            font-size: 18px;
        }

        .quantity-control button:hover {
            background: #ff4b23;
            border-color: #ff4b23;
        }

        .quantity-control span {
            color: white;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }


        /* =========================
           RIGHT ITEM
        ========================= */

        .cart-item-right {
            text-align: right;
        }

        .item-total {
            display: block;
            color: white;
            font-size: 17px;
            margin-bottom: 12px;
        }

        .remove-item {
            background: transparent;
            border: none;
            color: #ff4b23;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-item:hover {
            color: #ff704d;
        }


        /* =========================
           ORDER SUMMARY
        ========================= */

        .order-summary {
            background: #171717;
            border: 1px solid #2b2b2b;
            border-radius: 18px;
            padding: 28px;
        }

        .order-summary h2 {
            color: white;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 14px 0;

            color: #aaa;
        }

        .summary-row strong {
            color: white;
        }

        .summary-total {
            border-top: 1px solid #333;
            margin-top: 10px;
            padding-top: 20px;

            font-size: 20px;
        }

        .summary-total span:last-child {
            color: #ff4b23;
            font-size: 25px;
            font-weight: bold;
        }


        /* =========================
           CHECKOUT
        ========================= */

        .checkout-box {
            margin-top: 25px;

            background: #171717;
            border: 1px solid #2b2b2b;
            border-radius: 18px;
            padding: 28px;
        }

        .checkout-box h2 {
            color: white;
            margin-top: 0;
        }

        .checkout-box input,
        .checkout-box select {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            outline: none;
        }

        .checkout-box input:focus,
        .checkout-box select:focus {
            border-color: #ff4b23;
        }

        .checkout-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #ff4b23;
            color: white;

            font-weight: bold;
            font-size: 16px;

            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #ff3510;
        }


        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            color: white;
        }

        .empty-cart p {
            color: #aaa;
        }

        .menu-btn {
            display: inline-block;

            margin-top: 15px;

            padding: 12px 22px;

            background: #ff4b23;
            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        /* =========================
           SUCCESS POPUP
        ========================= */

        .success-popup {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            align-items: center;
            justify-content: center;

            z-index: 9999;
        }

        .success-box {
            background: #171717;

            border: 1px solid #333;

            border-radius: 18px;

            padding: 35px;

            width: 90%;
            max-width: 420px;

            text-align: center;
        }

        .success-box h2 {
            color: white;
        }

        .success-box p {
            color: #aaa;
            line-height: 1.6;
        }

        .success-box button {
            margin-top: 15px;

            padding: 11px 25px;

            border: none;
            border-radius: 8px;

            background: #ff4b23;
            color: white;

            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .nav-container {
                flex-direction: column;
                gap: 20px;
            }

        }


        @media (max-width: 600px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-item-right {
                margin-left: auto;
            }

            .nav-links {
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">
            Bite<span>Hub</span>
        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="cart.html" class="cart-link">

                🛒 Cart

                <span id="cart-count">
                    0
                </span>

            </a>

            <a href="login.html" class="login-btn">
                Login
            </a>

        </nav>

    </div>

</header>



<!-- =========================
     MAIN CART
========================= -->

<main class="cart-page">


    <div class="page-title">

        <h1>
            Your Shopping Cart 🛒
        </h1>

        <p>
            Review your items before checkout
        </p>

    </div>



    <div class="cart-layout">


        <!-- =====================
             ITEMS
        ====================== -->

        <div class="cart-box">

            <h2>
                Your Items
            </h2>

            <div id="cartItems">

            </div>

        </div>



        <!-- =====================
             RIGHT SIDE
        ====================== -->

        <div>


            <!-- ORDER SUMMARY -->

            <div class="order-summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        Rs. 0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <strong id="delivery">
                        Rs. 150
                    </strong>

                </div>


                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <span id="grandTotal">
                        Rs. 150
                    </span>

                </div>

            </div>



            <!-- CHECKOUT -->

            <div class="checkout-box">

                <h2>
                    Checkout
                </h2>


                <form id="checkoutForm">


                    <input
                        type="text"
                        id="customerName"
                        placeholder="Your Name"
                        required
                    >


                    <input
                        type="text"
                        id="customerAddress"
                        placeholder="Delivery Address"
                        required
                    >


                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="Phone Number"
                        required
                    >


                    <select
                        id="paymentMethod"
                        required
                    >

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Online Payment">
                            Online Payment
                        </option>

                    </select>


                    <button
                        type="submit"
                        class="checkout-btn">

                        Place Order

                    </button>

                </form>

            </div>

        </div>

    </div>

</main>



<!-- =========================
     SUCCESS POPUP
========================= -->

<div
    id="orderSuccess"
    class="success-popup">


    <div class="success-box">

        <h2>
            🎉 Order Successful!
        </h2>


        <p id="successMessage">
            Your order has been placed successfully.
        </p>


        <button
            onclick="closeSuccess()">

            Close

        </button>

    </div>

</div>



<!-- =========================
     CART JAVASCRIPT
========================= -->

<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("bitehubCart")
    ) || [];

}


function saveCart(cart) {

    localStorage.setItem(
        "bitehubCart",
        JSON.stringify(cart)
    );

    renderCart();

}


function updateCartCount() {

    const cart = getCart();

    let count = 0;

    cart.forEach(function(item) {

        count += Number(item.quantity) || 0;

    });


    const cartCount =
        document.getElementById("cart-count");


    if (cartCount) {

        cartCount.textContent = count;

    }

}


function getFoodImage(name) {

    const images = {

        "Classic Beef Burger":
        "../BiteHub_images/Burgers/burger_classic.jpg",

        "Ultimate Cheese Burger":
        "../BiteHub_images/Burgers/burger_cheese.jpg",

        "Double Beef Burger":
        "../BiteHub_images/Burgers/burger_double.jpg",

        "Spicy Chicken Burger":
        "../BiteHub_images/Burgers/burger_spicy.jpg",

        "Pepperoni Pizza":
        "../BiteHub_images/Pizzas/pizza_pepperoni.jpg",

        "Margherita Pizza":
        "../BiteHub_images/Pizzas/pizza_margherita.jpg",

        "Chicken Fajita Pizza":
        "../BiteHub_images/Pizzas/pizza_chicken_fajita.jpg",

        "BBQ Chicken Pizza":
        "../BiteHub_images/Pizzas/pizza_bbq_chicken.jpg",

        "Classic Fries":
        "../BiteHub_images/Fries/fries_classic.jpg",

        "Loaded Cheese Fries":
        "../BiteHub_images/Fries/fries_loaded.jpg",

        "Cheesy Fries":
        "../BiteHub_images/Fries/fries_cheese.jpg",

        "BBQ Chicken Wings":
        "../BiteHub_images/Wings/wings_bbq.jpg",

        "Classic Chicken Wings":
        "../BiteHub_images/Wings/wings_classic.jpg",

        "Honey Garlic Wings":
        "../BiteHub_images/Wings/wings_honey_garlic.jpg",

        "Special Chicken Roll":
        "../BiteHub_images/Rolls/roll_chicken.jpg",

        "Beef Roll":
        "../BiteHub_images/Rolls/roll_beef.jpg",

        "Cheese Roll":
        "../BiteHub_images/Rolls/roll_cheese.jpg",

        "Coca Cola":
        "../BiteHub_images/Drinks/drink_coke.jpg",

        "Pepsi":
        "../BiteHub_images/Drinks/drink_pepsi.jpg",

        "Chocolate Milkshake":
        "../BiteHub_images/Drinks/drink_milkshake.jpg",

        "Cheese Sauce":
        "../BiteHub_images/Sauces/sauce_cheese.jpg",

        "BBQ Sauce":
        "../BiteHub_images/Sauces/sauce_bbq.jpg"

    };


    return images[name] || "";

}



function renderCart() {

    const cart =
        getCart();


    const container =
        document.getElementById("cartItems");


    let subtotal = 0;


    if (!container) {
        return;
    }


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Add some delicious food!
                </p>

                <a
                    href="menu.html"
                    class="menu-btn">

                    Explore Menu

                </a>

            </div>

        `;

    }


    else {

        container.innerHTML = "";


        cart.forEach(function(item) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            subtotal += itemTotal;


            container.innerHTML += `

                <div class="cart-item">


                    <div class="cart-item-image">

                        <img
                            src="${getFoodImage(item.name)}"
                            alt="${item.name}"
                            onerror="this.style.display='none'"
                        >

                    </div>


                    <div class="cart-item-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            Rs. ${price}
                        </p>


                        <div class="quantity-control">

                            <button
                                onclick="changeQuantity('${item.name}', -1)">
                                −
                            </button>

                            <span>
                                ${quantity}
                            </span>

                            <button
                                onclick="changeQuantity('${item.name}', 1)">
                                +
                            </button>

                        </div>

                    </div>


                    <div class="cart-item-right">

                        <strong class="item-total">
                            Rs. ${itemTotal}
                        </strong>


                        <button
                            class="remove-item"
                            onclick="removeItem('${item.name}')">

                            Remove

                        </button>

                    </div>


                </div>

            `;

        });

    }


    const delivery =
        subtotal >= 2000 ? 0 : 150;


    document.getElementById("subtotal")
        .textContent =
        "Rs. " + subtotal.toLocaleString();


    document.getElementById("delivery")
        .textContent =
        delivery === 0
            ? "FREE"
            : "Rs. " + delivery;


    document.getElementById("grandTotal")
        .textContent =
        "Rs. " +
        (subtotal + delivery).toLocaleString();


    updateCartCount();

}



function changeQuantity(name, change) {

    let cart =
        getCart();


    const item =
        cart.find(function(item) {

            return item.name === name;

        });


    if (!item) {
        return;
    }


    item.quantity =
        Number(item.quantity) + change;


    if (item.quantity <= 0) {

        cart =
            cart.filter(function(item) {

                return item.name !== name;

            });

    }


    saveCart(cart);

}



function removeItem(name) {

    let cart =
        getCart();


    cart =
        cart.filter(function(item) {

            return item.name !== name;

        });


    saveCart(cart);

}



function closeSuccess() {

    document.getElementById(
        "orderSuccess"
    ).style.display = "none";

}



document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const cart =
            getCart();


        if (cart.length === 0) {

            alert(
                "Your cart is empty!"
            );

            return;

        }


        const name =
            document.getElementById(
                "customerName"
            ).value;


        const payment =
            document.getElementById(
                "paymentMethod"
            ).value;


        document.getElementById(
            "successMessage"
        ).textContent =

            "Thank you, " +
            name +
            "! Your order has been placed successfully using " +
            payment +
            ".";


        document.getElementById(
            "orderSuccess"
        ).style.display = "flex";


        localStorage.removeItem(
            "bitehubCart"
        );


        renderCart();

    }
);



document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderCart();

    }
);

</script>


</body>

</html>
